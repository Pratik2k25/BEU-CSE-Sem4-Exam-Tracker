<div id="modal"></div><div id="toast" class="toast hide" role="status"></div><script src="/data.js"></script><script>
(()=>{'use strict';const D=window.STUDY_DATA,KEY='beu-cse-sem4-tracker-local-v1',STAT=['Not started','Learning','Practiced','Recall passed','Exam-ready','Needs revision'],W={'Not started':0,'Learning':.25,'Practiced':.5,'Recall passed':.75,'Exam-ready':1,'Needs revision':.35};
const SHORTS=[
['CN','Define bandwidth, throughput, latency and jitter.','Bandwidth is link capacity; throughput is actual successful delivery rate; latency is end-to-end delay; jitter is variation in delay.'],
['CN','Differentiate circuit switching and packet switching.','Circuit switching reserves a dedicated path/resources. Packet switching shares links and forwards packets, which can take different routes.'],
['COA','Differentiate hardwired and microprogrammed control units.','Hardwired control uses fixed logic and is typically faster but harder to modify; microprogrammed control uses control memory and is more flexible.'],
['FLAT','Define DFA and NFA.','A DFA has exactly one transition for each state/input pair. An NFA can have multiple possible transitions. Both recognise exactly the regular languages.'],
['FLAT','What is an ambiguous context-free grammar?','A CFG is ambiguous if at least one string has two distinct parse trees, equivalently two distinct leftmost derivations.'],
['DAA','Define time complexity and space complexity.','Time complexity describes growth in computation work with input size; space complexity describes memory growth, usually using asymptotic bounds.'],
['DAA','Differentiate greedy algorithms and dynamic programming.','Greedy commits to local choices; DP stores and combines subproblem results. DP is effective with overlapping subproblems and optimal substructure.'],
['DBMS','Define primary key, candidate key and foreign key.','A candidate key minimally uniquely identifies rows; a primary key is the chosen candidate key; a foreign key references a key to enforce referential integrity.'],
['DBMS','What is a functional dependency?','X → Y means any two valid tuples agreeing on attributes X must also agree on attributes Y.'],
['ETC','Define technical communication.','Technical communication conveys specialised information to a defined audience for a practical purpose, through documents, diagrams, presentations or suitable channels.'],
['ETC','What is the purpose of an executive summary?','It provides a concise standalone overview of a report’s purpose, context/method, key findings and recommendations.']
];
function fresh(){return {version:1,onboarded:false,prefs:{hours:6,mode:'Balanced',name:'',prep:25},topics:{},dayDone:{},notes:[],mistakes:[],scores:[],sessions:[]}}
let st;try{let v=JSON.parse(localStorage.getItem(KEY));st=v&&v.version===1?Object.assign(fresh(),v):fresh()}catch(e){st=fresh()}
let page='dashboard',subFilter='ALL',qtype='ALL',search='',quiz=null,installEvent=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){toast('Storage full. Export your backup from Settings.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const longDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const days=d=>Math.ceil((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const topics=()=>D.subjects.flatMap(s=>s.units.flatMap((u,ui)=>u.topics.map((t,ti)=>({id:s.id+'-'+ui+'-'+ti,s:s.id,subject:s,unit:u.name,ui,ti,name:t[0],priority:t[1]}))));
const stt=t=>st.topics[t.id]?.status||'Not started';
const tp=s=>{let a=topics().filter(t=>t.s===s.id);return Math.round(a.reduce((n,t)=>n+(W[stt(t)]||0),0)/a.length*100)||0};
const total=()=>Math.round(topics().reduce((n,t)=>n+(W[stt(t)]||0),0)/topics().length*100)||0;
const activeExam=()=>D.exams.find(e=>e.date>=today())||D.exams.at(-1);
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hide'),2600)}
function head(title,desc){return '<div class="head"><div class="eyebrow">BEU B.Tech · CSE · Semester 4</div><h1>'+title+'</h1><p>'+desc+'</p></div>'}
function subjectCards(){return '<div class="grid three">'+D.subjects.map(s=>'<div class="card subject" data-subject="'+s.id+'"><div class="subjecttop"><div class="subjecticon" style="color:'+s.color+'">'+s.icon+'</div><div><div class="subjectname">'+esc(s.name)+'</div><div class="tiny muted">'+s.code+' · '+s.units.length+' units</div></div><div class="pct">'+tp(s)+'%</div></div><div class="subfoot"><span>'+topics().filter(t=>t.s===s.id&&['Recall passed','Exam-ready'].includes(stt(t))).length+'/'+topics().filter(t=>t.s===s.id).length+' recalled</span><span>'+s.units.reduce((n,u)=>n+u.topics.length,0)+' topics</span></div><div class="progress"><span style="width:'+tp(s)+'%;background:'+s.color+'"></span></div></div>').join('')+'</div>'}
function examCards(){return '<div class="grid three">'+D.exams.map(e=>'<div class="card exam" style="--exam:'+e.color+'"><div class="tiny muted">'+longDate(e.date)+' · '+(days(e.date)<0?'Past':days(e.date)===0?'Exam day':days(e.date)+' days left')+'</div><h3>'+esc(e.name)+'</h3><div class="tiny muted">'+e.code+'</div><div class="pill">2:00–5:00 PM</div></div>').join('')+'</div>'}
function makePlan(){let upcoming=D.exams.filter(e=>e.date>=today()),exam=upcoming[0]||D.exams.at(-1),eve=new Date(exam.date+'T12:00:00');eve.setDate(eve.getDate()-1);let focus=today()===exam.date||eve.toISOString().slice(0,10)===today()?[exam.id]:upcoming.slice(0,3).map(e=>e.id);if(!focus.includes('DBMS')&&days('2026-11-03')>=0&&days('2026-11-03')<=11)focus.push('DBMS');let pool=focus.flatMap(id=>topics().filter(t=>t.s===id&&stt(t)!=='Exam-ready'&&stt(t)!=='Recall passed').sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]-({High:0,Medium:1,Low:2}[b.priority]))).slice(0,3));if(st.prefs.mode==='Marks-focused')pool.sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]-({High:0,Medium:1,Low:2}[b.priority]));pool=pool.slice(0,Math.max(2,Math.ceil((+st.prefs.hours*60)/65)));if(!pool.length)pool=topics().slice(0,4);return pool.map((t,i)=>({id:today()+'-'+i,topicId:t.id,t,mins:Math.min(90,Math.max(30,Math.floor(st.prefs.hours*60/Math.max(1,pool.length))))}))}

function dashboard(){let p=makePlan(),done=p.filter(x=>st.dayDone[x.id]).length,e=activeExam();return head('Your study command centre','Small, focused sessions beat panic. Mark topics honestly and use recall—not reading time alone—to judge readiness.')+'<section class="hero"><div class="eyebrow">Your personal study space</div><h1>'+(st.prefs.name?'Welcome back, '+esc(st.prefs.name)+'.':'One session at a time.')+'</h1><p>'+st.prefs.hours+' focused hours/day · '+esc(st.prefs.mode)+' approach · '+st.prefs.prep+'% self-reported starting preparation. The tracker percentage below is calculated separately from topic status.</p><div class="actions"><button class="btn primary" data-page="plan">Open today’s plan →</button><button class="btn" data-page="subjects">Continue syllabus</button><button class="btn ghost" data-page="quiz">Take a quiz</button></div></section><div class="grid four"><div class="card stats"><div class="staticon">◉</div><div><div class="num">'+total()+'%</div><div class="tiny muted">Tracker progress</div></div></div><div class="card stats"><div class="staticon">✓</div><div><div class="num">'+topics().filter(t=>['Recall passed','Exam-ready'].includes(stt(t))).length+'</div><div class="tiny muted">Topics recalled / exam-ready</div></div></div><div class="card stats"><div class="staticon">◷</div><div><div class="num">'+st.prefs.hours+'h</div><div class="tiny muted">Daily study target</div></div></div><div class="card stats"><div class="staticon">✎</div><div><div class="num">'+st.scores.length+'</div><div class="tiny muted">Quiz attempts saved</div></div></div></div><div class="section"><h2>Today’s focused plan</h2><button class="btn ghost" data-page="plan">View all →</button></div><div class="grid two"><div class="card"><div class="section" style="margin:0 0 8px"><h2>Study blocks</h2><span class="tiny muted">'+done+'/'+p.length+' complete</span></div><div class="progress"><span style="width:'+(done/p.length*100)+'%"></span></div>'+p.slice(0,4).map(taskHtml).j function questionsPage(){let full=D.questions.filter(q=>(qtype==='ALL'||q.type===qtype)&&(subFilter==='ALL'||q.s===subFilter)&&(!search||q.q.toLowerCase().includes(search.toLowerCase())));let shorts=SHORTS.filter(q=>(subFilter==='ALL'||q[0]===subFilter)&&(!search||q[1].toLowerCase().includes(search.toLowerCase()))).map((q,i)=>({id:'short-'+i,s:q[0],type:'Short',q:q[1],a:q[2]}));if(qtype==='ALL'||qtype==='Short')full=full.concat(shorts);return head('Question bank','MCQ answers include explanations. Short questions are definition/revision prompts. Long answers include a proposed outline. Not all wording is transcribed verbatim from past papers.')+'<div class="actions"><input class="search" id="qsearch" value="'+esc(search)+'" placeholder="Search a topic or question…" style="flex:1"><select class="search" id="qtype" style="width:auto"><option value="ALL">All question types</option><option value="MCQ" '+(qtype==='MCQ'?'selected':'')+'>MCQ</option><option value="Short" '+(qtype==='Short'?'selected':'')+'>Short / define</option><option value="Long" '+(qtype==='Long'?'selected':'')+'>Long answer</option></select></div><div class="filters">'+[['ALL','All subjects'],...D.subjects.map(s=>[s.id,s.short])].map(([id,l])=>'<button class="filter '+(subFilter===id?'active':'')+'" data-filter="'+id+'">'+l+'</button>').join('')+'</div><p class="small muted">'+full.length+' questions in this view. Use ChatGPT links for a deeper explanation.</p>'+full.map(q=>{let subj=D.subjects.find(s=>s.id===(q.s||q.subject)),mcq=q.type==='MCQ';return '<article class="card qcard"><div class="actions" style="justify-content:space-between"><span class="eyebrow">'+q.type+' · '+esc(subj?.short||q.s)+'</span><span class="tiny muted">'+esc(q.year||'Syllabus practice')+'</span></div><div class="qtitle">'+esc(q.q)+'</div>'+(mcq?'<div class="opts">'+q.o.map((o,i)=>'<button class="option" data-answer="'+q.id+'" data-opt="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><div class="answer hide" id="f-'+q.id+'"></div>':'<button class="btn ghost" data-show="'+q.id+'">Show suggested answer</button><div class="answer hide" id="a-'+q.id+'">'+(q.outline?'<b>Suggested answer structure</b><ul>'+q.outline.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<b>Definition / concise answer</b><p>'+esc(q.a||q.e||'')+'</p>')+'<p class="tiny muted">'+esc(q.evidence||q.why||'Syllabus-aligned practice prompt.')+'</p></div>')+'<div class="actions" style="margin-top:11px"><a class="btn primary" target="_blank" rel="noopener" href="'+chat('Act as my BEU CSE semester 4 study mentor. Explain this question step by step and provide a structured exam-ready answer, diagrams/formulas where relevant and common mistakes: '+q.q+(q.outline?' Answer points: '+q.outline.join('; '):''))+'">Study with ChatGPT ↗</a><button class="btn ghost" data-revise="'+q.id+'">Add to revision</button></div></article>'}).join('')}

function quizPage(){if(!quiz)return head('Quiz & test mode','Test recall without looking at notes. Scores are recorded locally.')+'<div class="grid two"><div class="card"><h2>Mixed quick test</h2><p class="small muted">10 MCQs across available subjects with instant feedback.</p><button class="btn primary" data-startquiz="all">Start mixed quiz →</button></div><div class="card"><h2>Subject practice</h2><p class="small muted">Choose a single subject.</p><select id="quizSub" class="search" style="width:100%">'+D.subjects.map(s=>'<option value="'+s.id+'">'+s.short+' — '+esc(s.name)+'</option>').join('')+'</select><button class="btn" style="margin-top:10px" data-startquiz="sub">Start quiz →</button></div></div><div class="section"><h2>Recent attempts</h2></div><div class="card">'+(st.scores.length?st.scores.slice(-10).reverse().map(x=>'<div class="task"><div class="tasktitle">'+longDate(x.date)+' · '+esc(x.label)+'</div><span class="pct">'+x.score+'/'+x.total+'</span></div>').join(''):'<p class="small muted">No attempts yet. Use a quiz to measure recall.</p>')+'</div>';

function settingsPage(){return head('Preferences & backup','Tune your plan and keep progress safe. There is no cloud account or cross-device sync.')+'<div class="grid two"><form id="prefsForm" class="card"><h2>Study preferences</h2><div class="field"><label>Your name (optional)</label><input id="prefName" value="'+esc(st.prefs.name)+'" placeholder="Your name"></div><div class="field"><label>Study hours/day</label><select id="prefHours">'+[4,6,8,12].map(h=>'<option value="'+h+'" '+(h===+st.prefs.hours?'selected':'')+'>'+h+' hours'+(h===12?' · emergency mode':'')+'</option>').join('')+'</select></div><div class="field"><label>Preparation style</label><select id="prefMode">'+['Balanced','Marks-focused','Crash course'].map(m=>'<option '+(m===st.prefs.mode?'selected':'')+'>'+m+'</option>').join('')+'</select></div><div class="field"><label>Starting preparation: <b id="prepLabel">'+st.prefs.prep+'%</b></label><input id="prefPrep" type="range" min="0" max="100" step="5" value="'+st.prefs.prep+'"></div><button class="btn primary">Save preferences</button><p class="tiny muted">Self-reported starting prep is separate from tracker-recorded progress.</p></form><div class="card"><h2>Backup & restore</h2><p class="small muted">Export a JSON backup before clearing browser data or moving to another device. Import replaces current local progress.</p><div class="actions" style="margin:14px 0"><button class="btn primary" data-action="export">Export backup</button><label class="btn" for="import">Restore backup</label><input id="import" type="file" accept="application/json" class="hide"></div><div class="notice"><b>Local privacy:</b><br>Data stays in this browser/profile, not on a server. Another device will not receive the data automatically. Normal app updates reuse the same key, but clearing site storage may erase it.</div><div class="section"><h2>Reset workspace</h2></div><button class="btn" data-action="reset">Reset all local data</button></div></div><div class="section"><h2>Content note</h2></div><div class="card small muted">Syllabus topics are condensed from the supplied BEU CSE Semester 4 syllabus PDF. Exam codes and dates were transcribed from the supplied routine. Check any newer BEU/college notice. Topic priorities are study guidance, not official marks weightage or question predictions. Practice wording is not represented as verbatim past-paper text unless stated.</div>'}

function onboard(){let hours=6,mode='Balanced',name='',prep=25,step=1;let root=document.querySelector('#modal');function draw(){root.innerHTML='<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">BEU CSE · Semester 4</div><h2>'+(step===1?'Build your study plan':step===2?'Choose preparation style':'Personalise your workspace')+'</h2><p>'+(step===1?'Roz kitne ghante padh sakte ho?':step===2?'Preparation kaise karni hai?':'Optional details. Your progress stays local to this device.')+'</p>'+(step===1?'<div class="choices">'+[[4,'4 hours','College and other work'],[6,'6 hours','Serious preparation'],[8,'8 hours','Full exam mode'],[12,'12 hours','Emergency mode 💀']].map(x=>'<button class="choice '+(hours===x[0]?'selected':'')+'" data-hour="'+x[0]+'"><strong>'+x[1]+'</strong><small>'+x[2]+'</small></button>').join('')+'</div>':step===2?'<div class="choices">'+[['Balanced','Concepts + PYQs'],['Marks-focused','High-priority topics first'],['Crash course','Basics to exam-ready answers']].map(x=>'<button class="choice '+(mode===x[0]?'selected':'')+'" data-mode="'+x[0]+'"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></button>').join('')+'</div>':'<div class="field"><label>Name (optional)</label><input id="onName" value="'+esc(name)+'" placeholder="Name"></div><div class="field"><label>Starting preparation: <b id="onPrepLabel">'+prep+'%</b></label><input id="onPrep" type="range" min="0" max="100" step="5" value="'+prep+'"></div><div class="notice"><b>Local-first:</b> plan, notes and progress are saved in this browser. Export backups to move devices.</div>')+'<div class="modalfoot">'+(step>1?'<button class="btn ghost" data-back>Back</button>':'<span class="tiny muted">No account required</span>')+'<button class="btn primary" data-next>'+(step===3?'Build my study plan →':'Continue →')+'</button></div><p class="tiny muted">Exam dates loaded from routine: 29 Oct–7 Nov 2026 · 2–5 PM.</p></div></div>';root.querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>{hours=+b.dataset.hour;draw()});root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});let nm=root.querySelector('#onName');if(nm)nm.oninput=()=>name=nm.value;let pr=root.querySelector('#onPrep');if(pr)pr.oninput=()=>{prep=+pr.value;root.querySelector('#onPrepLabel').textContent=prep+'%'};root.querySelector('[data-back]')?.addEventListener('click',()=>{step--;draw()});root.querySelector('[data-next]').onclick=()=>{if(step<3){step++;draw()}else{st.prefs={hours,mode,name,prep};st.onboarded=true;save();root.innerHTML='';go('dashboard');toast('Your plan is saved. Start with today’s first study block.')}}}draw()}

function finishQuiz(){quiz.score=quiz.items.reduce((n,q,i)=>n+(quiz.answers[i]===q.a?1:0),0);quiz.finished=true;st.scores.push({date:today(),label:quiz.label,score:quiz.score,total:quiz.items.length});save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('button,a');if(!b)return;if(b.dataset.page){e.preventDefault();go(b.dataset.page);return}if(b.dataset.subject){subFilter=b.dataset.subject;go('subjects');return}if(b.dataset.filter){subFilter=b.dataset.filter;render();return}if(b.dataset.openS){subFilter=b.dataset.openS;go('subjects');return}if(b.dataset.done){st.dayDone[b.dataset.done]=!st.dayDone[b.dataset.done];save();render();return}if(b.dataset.topicstatus){st.topics[b.dataset.topicstatus]={status:b.value,updated:today()};save();render();toast('Topic progress saved.');return}if(b.dataset.noteTopic){let t=topics().find(x=>x.id===b.dataset.noteTopic);document.querySelector('#modal').innerHTML='<div class="modalwrap"><div class="modal"><h2>Quick study note</h2><p>'+esc(t?.name)+'</p><form id="quickNote" data-topic="'+b.dataset.noteTopic+'"><div class="field"><label>Key idea / formula / mistake</label><textarea id="quickBody" required rows="4"></textarea></div><div class="modalfoot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Save note</button></div></form></div></div>';return}if(b.dataset.close){document.querySelector('#modal').innerHTML='';return}if(b.dataset.show){document.querySelector('#a-'+b.dataset.show)?.classList.toggle('hide');return}if(b.dataset.answer!==undefined){let q=D.questions.find(q=>q.id===b.dataset.answer);if(!q)return;let right=+b.dataset.opt===q.a,fb=document.querySelector('#f-'+q.id);fb.innerHTML='<b style="color:'+(right?'var(--mint)':'var(--red)')+'">'+(right?'Correct.':'Not quite.')+'</b> Correct answer: '+esc(q.o[q.a])+'. '+esc(q.e);fb.classList.remove('hide');b.parentElement.querySelectorAll('.option').forEach((x,i)=>{x.disabled=true;x.classList.toggle('correct',i===q.a);x.classList.toggle('wrong',x===b&&!right)});return}if(b.dataset.revise){let q=D.questions.find(x=>x.id===b.dataset.revise);st.mistakes.push({id:String(Date.now()),sub:q.s,title:q.q,fix:'Revisit the explanation; write an answer from memory.',done:false,date:today()});save();toast('Added to revision list.');return}if(b.dataset.startquiz){startQuiz(b.dataset.startquiz==='sub'?document.querySelector('#quizSub').value:'all');return}if(b.dataset.quizopt!==undefined&&quiz){quiz.answers[quiz.i]=+b.dataset.quizopt;render();return}if(b.dataset.action==='nextquiz'&&quiz){if(quiz.i===quiz.items.length-1)finishQuiz();else{quiz.i++;render()}return}if(b.dataset.action==='exitquiz'||b.dataset.action==='newquiz'){quiz=null;go('quiz');return}if(b.dataset.action==='export'){exportData();return}if(b.dataset.action==='reset'&&confirm('Clear all local study records? Export a backup first.')){localStorage.removeItem(KEY);st=fresh();save();go('dashboard');onboard();return}if(b.dataset.action==='log'){let p=makePlan(),mins=p.filter(x=>st.dayDone[x.id]).reduce((n,x)=>n+x.mins,0);if(!mins){toast('Tick a completed block first.');return}st.sessions.push({date:today(),minutes:mins});save();toast('Logged '+mins+' minutes. Good work.');return}if(b.dataset.delnote){st.notes=st.notes.filter(x=>x.id!==b.dataset.delnote);save();render();return}if(b.dataset.delm istake){return}if(b.dataset.delmistake){st.mistakes=st.mistakes.filter(x=>x.id!==b.dataset.delmistake);save();render();return}if(b.dataset.mdone){let m=st.mistakes.find(x=>x.id===b.dataset.mdone);if(m)m.done=!m.done;save();render();return}});
document.addEventListener('change',e=>{if(e.target.id==='qtype'){qtype=e.target.value;render()}if(e.target.id==='import'&&e.target.files[0]){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==1||!x.prefs||!x.topics)throw Error();if(confirm('Replace current progress with this backup?')){st=Object.assign(fresh(),x);save();go('dashboard');toast('Backup restored.')}}catch(_){toast('Backup file is invalid or unsupported.')}e.target.value=''};r.readAsText(f)}});
document.addEventListener('input',e=>{if(e.target.id==='qsearch'){search=e.target.value;let p=e.target.selectionStart;render();let i=document.querySelector('#qsearch');i?.focus();i?.setSelectionRange(p,p)}if(e.target.id==='prefPrep')document.querySelector('#prepLabel').textContent=e.target.value+'%'});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='noteForm'){st.notes.push({id:String(Date.now()),sub:f.noteSub.value,title:f.noteTitle.value.trim(),body:f.noteBody.value.trim(),date:today()});save();go('notes');toast('Note saved locally.')}if(f.id==='mistakeForm'){st.mistakes.push({id:String(Date.now()),sub:f.mistakeSub.value,title:f.mistakeTitle.value.trim(),fix:f.mistakeFix.value.trim(),done:false,date:today()});save();go('notes');toast('Mistake added to revision log.')}if(f.id==='quickNote'){let t=topics().find(x=>x.id===f.dataset.topic);st.notes.push({id:String(Date.now()),sub:t?.s||'CN',title:t?.name||'Topic note',body:f.quickBody.value,date:today()});save();document.querySelector('#modal').innerHTML='';toast('Note saved.')}if(f.id==='prefsForm'){st.prefs={...st.prefs,name:f.prefName.value.trim(),hours:+f.prefHours.value,mode:f.prefMode.value,prep:+f.prefPrep.value};save();go('dashboard');toast('Preferences saved.')}});
document.querySelector('#install').onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else toast('Open browser menu and choose Install app / Add to Home screen.')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;document.querySelector('#install').classList.remove('hide')});window.addEventListener('appinstalled',()=>toast('App installed. Progress stays on this device.'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
render();if(!st.onboarded)onboard();
})();
</script></body></html>
